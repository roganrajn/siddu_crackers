name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            set -e

            echo "========== Starting Deployment =========="

            # 🔥 CHECK NODE (must be v20+ installed on VPS)
            node -v
            which node

            PROJECT_DIR="/var/www/html/SidduCrackers"

            cd $PROJECT_DIR

            echo "Updating source..."
            git fetch origin
            git reset --hard origin/main

            echo "Building Frontend..."
            cd frontend

            npm install
            npm run build

            echo "Installing Backend..."
            cd ../backend

            npm install

            echo "Restarting Backend..."
            pm2 restart siddu-backend || pm2 start index.js --name siddu-backend

            pm2 save

            echo "========== Deployment Completed =========="
