name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            PROJECT_DIR="/var/www/html/SidduCrackers"

            echo "========== Starting Deployment =========="

            cd $PROJECT_DIR

            echo "Updating source..."
            git fetch origin
            git reset --hard origin/main

            echo "Building Frontend..."
            cd frontend
            npm install
            npm run build

            echo "Installing Backend..."
            cd ../backend
            npm install

            echo "Restarting Backend..."
            pm2 restart sidducrackers-backend || pm2 start npm --name sidducrackers-backend -- start

            pm2 save

            echo "========== Deployment Completed =========="
