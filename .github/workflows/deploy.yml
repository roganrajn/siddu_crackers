name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            PROJECT_DIR="/var/www/html/SidduCrackers"

            echo "===================================="
            echo "Starting Deployment..."
            echo "===================================="

            cd $PROJECT_DIR

            echo "Updating repository..."
            git fetch origin
            git reset --hard origin/main

            echo "===================================="
            echo "Installing Frontend Dependencies..."
            echo "===================================="

            cd frontend
            npm install
            npm run build

            echo "===================================="
            echo "Installing Backend Dependencies..."
            echo "===================================="

            cd ../backend
            npm install

            echo "===================================="
            echo "Restarting Backend..."
            echo "===================================="

            pm2 restart sidducrackers-backend || pm2 start npm --name sidducrackers-backend -- start

            echo "===================================="
            echo "Restarting Frontend..."
            echo "===================================="

            pm2 restart sidducrackers-frontend || pm2 start npm --name sidducrackers-frontend -- start

            pm2 save

            echo "===================================="
            echo "Deployment Completed Successfully!"
            echo "===================================="
