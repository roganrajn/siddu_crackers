name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            set -e

            echo "========== Starting Deployment =========="

            # 🔥 CHECK NODE (must be v20+ installed on VPS)
            node -v
            which node

            PROJECT_DIR="/var/www/html/SidduCrackers"

            cd $PROJECT_DIR

            echo "Updating source..."
            git fetch origin
            git reset --hard origin/main

            echo "Building Frontend..."
            cd frontend

            npm install
            npm run build

            echo "Installing Backend..."
            cd "$PROJECT_DIR/backend"
            npm install

            echo "Verifying GST route in source..."
            grep -n "router.put('/gst/:id'" src/routes/orders.js
            grep -n "export async function updateOrderGst" src/services/order.service.js

            echo "Running database migrations..."
            cd "$PROJECT_DIR"
            if [ -f backend/.env ]; then
              DATABASE_URL=$(grep '^DATABASE_URL=' backend/.env | cut -d= -f2-)
              for migration in database/migration_v5.sql database/migration_v6.sql database/migration_v7.sql database/migration_v8.sql database/migration_v9.sql; do
                if [ -f "$migration" ]; then
                  echo "Applying $migration..."
                  psql "$DATABASE_URL" -f "$migration" || echo "Warning: $migration skipped or failed"
                fi
              done
            fi

            echo "Restarting Backend..."
            cd "$PROJECT_DIR/backend"
            pm2 delete siddu-backend || true
            pm2 start npm --name siddu-backend --cwd "$PROJECT_DIR/backend" -- start
            sleep 3
            pm2 save

            echo "Probing GST route..."
            GST_PROBE_BODY=$(mktemp)
            GST_PROBE_CODE=$(curl -s -o "$GST_PROBE_BODY" -w "%{http_code}" -X PUT http://127.0.0.1:3001/api/orders/gst/1 \
              -H "Content-Type: application/json" \
              -d '{"gst_enabled":true}' || true)
            echo "GST probe HTTP $GST_PROBE_CODE"
            cat "$GST_PROBE_BODY" || true
            if grep -q "Cannot PUT" "$GST_PROBE_BODY"; then
              echo "ERROR: GST route not registered after restart"
              exit 1
            fi
            if [ "$GST_PROBE_CODE" = "404" ] && ! grep -q "Order not found" "$GST_PROBE_BODY"; then
              echo "ERROR: GST endpoint returned 404"
              exit 1
            fi
            rm -f "$GST_PROBE_BODY"

            echo "Updating Nginx upload limit..."
            NGINX_CONF="/etc/nginx/nginx.conf"
            if [ -f "$NGINX_CONF" ]; then
              if grep -q "client_max_body_size" "$NGINX_CONF"; then
                sudo sed -i 's/client_max_body_size[^;]*;/client_max_body_size 12M;/' "$NGINX_CONF"
              else
                sudo sed -i '/^http {/a \    client_max_body_size 12M;' "$NGINX_CONF"
              fi
              sudo nginx -t && sudo systemctl reload nginx
            fi

            pm2 save

            echo "========== Deployment Completed =========="
