name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 🔥 FIX 1: Force correct Node version in GitHub runner
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # SSH deploy step
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            PROJECT_DIR="/var/www/html/SidduCrackers"

            echo "========== Starting Deployment =========="

            cd $PROJECT_DIR

            echo "Updating source code..."
            git fetch origin
            git reset --hard origin/main

            echo "========== Building Frontend =========="
            cd frontend

            # 🔥 FIX 2: completely clean broken installs
            rm -rf node_modules package-lock.json
            rm -rf ~/.npm

            npm cache clean --force

            # install correct binaries (fixes rolldown/native deps)
            npm install --include=optional

            npm run build

            echo "========== Installing Backend =========="
            cd ../backend
            npm install

            echo "========== Restarting Backend =========="
            pm2 restart siddu-backend
            pm2 save

            echo "========== Deployment Completed =========="
